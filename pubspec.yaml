name: stack_pulse
description: "Stack Go - Premium Minimalist 2D Precision Stacking Game in Flutter & Flame"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.20.0
  shared_preferences: ^2.2.3
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.2.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/images/
    - assets/videos/
    - assets/stack_go_logo.png
    - assets/splah_before.mp4
